<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>World Effects</title>
  <meta itemprop="name" content="World Effects">
  <meta name="twitter:title" content="World Effects">
  <meta property="og:title" content="World Effects">
  <meta property="og:site_name" content="World Effects">
  <meta name="description" content="This project demonstrates how to use World Effects to anchor virtual content to a flat surface.">
  <meta itemprop="description" content="This project demonstrates how to use World Effects to anchor virtual content to a flat surface.">
  <meta property="og:description" content="This project demonstrates how to use World Effects to anchor virtual content to a flat surface.">
  <meta name="twitter:description" content="This project demonstrates how to use World Effects to anchor virtual content to a flat surface.">
  <script crossorigin="anonymous" src="./external/runtime/runtime.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js" async crossorigin="anonymous" data-preload-chunks="slam"></script>
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/landing-page@1/dist/landing-page.js" crossorigin="anonymous"></script>
  <meta property="og:image" content="https://8thwall.org/studio-world-effects-example/assets/preview.png">
  <style>
    #animation-controls { position: fixed; left: 5%; bottom: calc(140px + env(safe-area-inset-bottom, 0px)); width: 90%; max-width: 480px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; z-index: 10; }
    #animation-controls[hidden] { display: none; }
    #animation-controls button { min-height: 44px; padding: 8px 12px; border: 0; border-radius: 8px; background: #2463eb; color: white; font: 16px/1.4 system-ui, sans-serif; cursor: pointer; touch-action: manipulation; }
    #animation-controls button[data-clip="idle"] { background: #444444; }
    #animation-controls button:focus-visible { outline: 3px solid white; outline-offset: 2px; }
    #animation-controls button:active { filter: brightness(.85); }
    #photo-preview { width: min(90vw, 480px); max-height: 90dvh; box-sizing: border-box; border: 0; border-radius: 16px; padding: 20px; color: white; background: #171717; font-family: sans-serif; text-align: center; }
    #photo-preview::backdrop { background: rgba(0, 0, 0, .8); }
    #photo-image { display: block; max-width: 100%; max-height: 60dvh; margin: 0 auto 16px; object-fit: contain; }
    #photo-preview .actions { display: flex; gap: 12px; justify-content: center; }
    #photo-preview a, #photo-preview button { border: 0; border-radius: 8px; padding: 12px 18px; font: inherit; cursor: pointer; text-decoration: none; }
    #photo-save { background: #2463eb; color: white; }
    #photo-close { background: #eeeeee; color: #171717; }
    #photo-preview p { font-size: 14px; line-height: 1.4; }
  </style>
</head>

<body>
<div id="animation-controls" hidden role="group" aria-label="Ações do Opinho"></div>
<dialog id="photo-preview" aria-label="Foto capturada">
  <img id="photo-image" alt="Foto da cena em realidade aumentada">
  <div class="actions">
    <a id="photo-save" download>Salvar foto</a>
    <button id="photo-close" type="button">Voltar</button>
  </div>
  <p>Você também pode manter a imagem pressionada para salvá-la no celular.</p>
</dialog>
<script src="bundle.js"></script>

</body>

</html>
